name: Refresh swing report

on:
  workflow_dispatch:          # "Run workflow" button in the GitHub mobile app or website
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays 21:30 UTC = 4:30pm New York (winter), 5:30pm (summer)

# Nothing is granted by default; each job asks for only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read          # read this repo's code, nothing else
    steps:
      # Every action is pinned to a full commit SHA, so a moved tag can't swap in different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Exact versions and SHA-256 checksums for every package; a tampered package fails to install.
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements.txt

      - name: Build report
        run: python swing_report.py -o site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write            # publish to GitHub Pages
      id-token: write         # short-lived token Pages uses to verify this run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
